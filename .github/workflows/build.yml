name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            artifact: superpawn
            archive: superpawn-linux-x64.tar.gz
            cmake_args: ""
          - name: macos-universal
            os: macos-latest
            artifact: superpawn
            archive: superpawn-macos-universal.tar.gz
            cmake_args: "'-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64'"
          - name: windows-x64
            os: windows-latest
            artifact: superpawn.exe
            archive: superpawn-windows-x64.zip
            cmake_args: "-A x64"
          - name: windows-x86
            os: windows-latest
            artifact: superpawn.exe
            archive: superpawn-windows-x86.zip
            cmake_args: "-A Win32"

    steps:
      - uses: actions/checkout@v4

      - name: Set build metadata
        shell: bash
        run: |
          echo "BUILD_ID=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "BUILD_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "BUILD_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Configure
        run: cmake -S . -B build -DBUILD_DOCS=OFF -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate binary
        id: locate
        shell: bash
        run: |
          if [ -f "build/Release/${{ matrix.artifact }}" ]; then
            echo "path=build/Release/${{ matrix.artifact }}" >> $GITHUB_OUTPUT
          else
            echo "path=build/${{ matrix.artifact }}" >> $GITHUB_OUTPUT
          fi

      - name: Smoke test
        shell: bash
        run: |
          printf 'uci\nquit\n' | "${{ steps.locate.outputs.path }}" | grep -q uciok

      - name: Perft tests
        shell: bash
        run: tests/perft/perft.sh "${{ steps.locate.outputs.path }}"

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ steps.locate.outputs.path }}" dist/
          cp README.md dist/
          cp logo/logo-small.bmp dist/ 2>/dev/null || true

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C dist .

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
