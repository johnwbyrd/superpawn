name: Build

on:
  push:
    branches: [master, feature/next]
    tags: ['v*']
  pull_request:
    branches: [master, feature/next]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            cmake_args: -DSP_WERROR=ON
            artifact: superpawn-linux-x64
            binary: superpawn
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cmake_args: -DSP_WERROR=ON
          - name: linux-generic-debug
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            # Debug build with assertions, generic architecture, no PEXT
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DSP_ARCH=x86-64 -DSP_LTO=OFF
            bench_depth: 6
          - name: linux-pext
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cmake_args: -DSP_USE_PEXT=ON -DSP_WERROR=ON
          - name: macos-arm64
            os: macos-latest
            cc: clang
            cxx: clang++
            # Apple Silicon: exercises the portable (non-x86) code paths
            cmake_args: -DSP_WERROR=ON
            artifact: superpawn-macos-arm64
            binary: superpawn
          - name: windows-msvc
            os: windows-latest
            cmake_args: -A x64
            artifact: superpawn-windows-x64
            binary: Release/superpawn.exe

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # for git describe

      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure -R unit

      - name: Bench
        shell: bash
        run: |
          BIN=build/${{ matrix.binary || 'superpawn' }}
          [ -f "$BIN" ] || BIN=build/Release/superpawn.exe
          [ -f "$BIN" ] || BIN=build/superpawn
          printf 'uci\nquit\n' | "$BIN" | grep -q uciok
          "$BIN" bench 16 1 ${{ matrix.bench_depth || 12 }} 2>&1 | tail -4

      - name: Upload binary
        if: matrix.artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.binary }}
