; Polyglot adapter config: lets xboard (and other XBoard/Winboard GUIs)
; talk to superpawn, which only speaks UCI.
;
; Launch with:
;   xboard -fcp "polyglot play.ini"
; from the repo root. Assumes the engine is built at ./build/superpawn
; (run `cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build`).

[PolyGlot]
EngineName   = Superpawn
EngineDir    = build
EngineCommand = ./superpawn
Log          = false
LogFile      = /tmp/polyglot.log

[Engine]
Hash         = 128
