; Superpawn, a UCI chess engine.
;
; PolyGlot adapter configuration. XBoard, WinBoard and other GUIs that speak
; the XBoard protocol cannot talk to a UCI engine directly; PolyGlot sits
; between them and translates.
;
; From the repository root, with the engine built at build/superpawn:
;
;     xboard -fcp "polyglot play.ini"
;
; To use a downloaded release instead, point EngineDir at the unpacked
; folder. Keys in the [Engine] section are UCI options and their values.

[PolyGlot]
EngineName    = Superpawn
EngineDir     = build
EngineCommand = ./superpawn
Log           = false
LogFile       = /tmp/polyglot.log

[Engine]
Hash          = 256
Threads       = 1
